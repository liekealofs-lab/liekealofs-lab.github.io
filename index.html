<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSpetters App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🔵 HEADER -->
  <header class="main-header">
    <div class="header-left">
      <button id="to-home" class="btn-header">🏠 Hoofdmenu</button>
      <button id="back-button" class="btn-header">← Terug</button>
    </div>

    <h2 id="header-title">SuperSpetters</h2>

    <div class="header-right">
      <button id="add-student-button" class="btn-header primary">+ Nieuwe superspetter</button>
    </div>
  </header>

  <!-- 🏠 HOME -->
  <section id="home-page">
    <div class="page-header">
      <h1 class="home-title">Welkom Lieke</h1>
    </div>

    <div class="home-grid">
      <button id="home-superspetters" class="home-card">🧒 SuperSpetters</button>
      <button id="home-agenda" class="home-card">📅 Agenda</button>
    </div>
  </section>

  <!-- 👧 GROEPEN -->
  <section id="groups-container" class="hidden">
    <div class="page-header">
      <h2>Groepen</h2>
    </div>
    <div id="groups-list"></div>
  </section>

  <!-- 👩 STUDENTENLIJST -->
  <section id="students-container" class="hidden">
    <div class="page-header">
      <h2 id="group-title"></h2>
      <div class="search-toolbar">
        <input id="student-search" type="text" placeholder="Zoek superspetter...">
      </div>
    </div>
    <div id="students-list"></div>
  </section>

  <!-- 🧾 STUDENT DETAIL -->
  <section id="student-edit" class="hidden">
    <div class="student-header-card">
      <div class="student-header-left">
        <div class="student-name-row">
          <h2 id="student-name">Naam leerling</h2>
          <button id="edit-name-button" class="btn-icon edit-icon">✏️</button>
        </div>

        <div class="student-group-row">
          <span id="student-group-badge" class="group-badge">Groep X</span>
          <button id="edit-group-button" class="btn-icon edit-icon">✏️</button>
        </div>
      </div>

      <div class="student-header-right">
        <div class="sticker-wrapper">
          <span id="student-sticker" class="sticker-circle">0</span>
          <button id="edit-sticker-button" class="btn-icon">✏️</button>
        </div>
      </div>
    </div>

    <form id="student-form" class="student-form-card hidden">
      <div class="form-row">
        <label for="edit-firstname">Naam</label>
        <input type="text" id="edit-firstname">
      </div>

      <div class="form-row">
        <label for="edit-group">Groep</label>
        <select id="edit-group">
          <option value="MiniSpetters">MiniSpetters</option>
          <option value="Beginners">Beginners</option>
          <option value="Gevorderden">Gevorderden</option>
          <option value="Uitblinkers">Uitblinkers</option>
        </select>
      </div>

      <div class="form-actions">
        <button id="save-student-edit" class="btn btn-primary">Opslaan</button>
        <button id="delete-student" class="btn btn-danger">Verwijderen</button>
      </div>
    </form>

    <h2 class="section-title">Vaardigheden</h2>
    <div id="skills-list"></div>
  </section>

  <!-- 📅 AGENDA -->
  <section id="agenda-page" class="hidden">
    <div class="page-header">
      <h2>Agenda</h2>
    </div>
    <div class="calendar-container">
      <div id="calendar"></div>
    </div>

    <div class="vacation-form">
      <h3>Vakantie toevoegen</h3>
      <label>Naam</label>
      <input type="text" id="vacation-title">
      <label>Startdatum</label>
      <input type="date" id="vacation-start">
      <label>Einddatum</label>
      <input type="date" id="vacation-end">
      <button id="add-vacation" class="btn btn-primary">Toevoegen</button>
    </div>
  </section>

  <!-- ➕ MODAL -->
  <div id="add-student-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Nieuwe superspetter</h3>
      <label>Naam</label>
      <input id="new-student-name" type="text">
      <label>Groep</label>
      <select id="new-student-group">
        <option value="MiniSpetters">MiniSpetters</option>
        <option value="Beginners">Beginners</option>
        <option value="Gevorderden">Gevorderden</option>
        <option value="Uitblinkers">Uitblinkers</option>
      </select>
      <div class="modal-actions">
        <button id="save-student-button" class="btn btn-primary">Opslaan</button>
        <button id="cancel-student-button" class="btn btn-secondary">Annuleren</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
