<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Progress Webapp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Studentenoverzicht</h1>
  </header>

  <main>

    <!-- GROEPEN -->
    <div id="groups-container">
      <h2>Groepen</h2>
      <div id="groups-list"></div>
    </div>

    <!-- STUDENTEN -->
    <div id="students-container" style="display:none;">
      <button id="back-to-groups" class="secondary-button">← Terug</button>
      <h2 id="group-title"></h2>

      <!-- DEZE KNOP ZIE JE HIER -->
      <button id="add-student-button" class="primary-button">+ Student toevoegen</button>

      <div id="students-list"></div>
    </div>

    <!-- STUDENT BEWERKEN -->
    <div id="student-edit" style="display:none;">
      <button id="back-to-students">← Terug</button>
      <h2 id="student-name"></h2>

      <form id="student-form">
        <label>Groep:</label>
        <span id="group-value"></span>

        <label>Sticker:</label>
        <input type="number" id="sticker">

        <h3>Vaardigheden</h3>
        <div id="skills-list"></div>
      </form>
    </div>

  </main>

  <!-- POPUP: STUDENT TOEVOEGEN -->
  <div id="add-student-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Nieuwe student</h3>

      <label>Voornaam:</label>
      <input id="new-student-name" type="text">

      <label>Groep:</label>
      <select id="new-student-group">
        <option value="MiniSpetters">MiniSpetters</option>
        <option value="Beginners">Beginners</option>
        <option value="Gevorderden">Gevorderden</option>
        <option value="Uitblinkers">Uitblinkers</option>
      </select>

      <button id="save-student-button">Opslaan</button>
      <button id="cancel-student-button">Annuleren</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
