<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Progress Webapp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple starting page for your project.</p>
  </header>

  <nav class="mobile-nav">
    <button id="nav-groups" class="nav-button active">Groepen</button>
    <button id="nav-students" class="nav-button">Studenten</button>
  </nav>

  <main>
    <div class="search-toolbar">
      <label class="search-wrap">
        <input id="student-search" type="search" placeholder="Zoek student...">
        <span class="search-hint">Sorteer standaard op sticker</span>
      </label>
    </div>

    <!-- GROEPEN -->
    <div id="groups-container">
      <h2>Groepen</h2>
      <div id="groups-list"></div>
    </div>

    <!-- STUDENTEN -->
    <div id="students-container" style="display: none;">
      <div class="back-button-wrap">
        <button id="back-to-groups" class="secondary-button">← Terug naar Groepen</button>
      </div>

      <h2 id="group-title"></h2>

      <!-- STUDENT TOEVOEGEN KNOP -->
      <button id="add-student-button" class="primary-button">+ Student toevoegen</button>

      <div id="students-list"></div>
    </div>

    <!-- STUDENT BEWERKEN -->
    <div id="student-edit" style="display: none;">
      <button id="back-to-students">Terug naar Studenten</button>
      <h2 id="student-name"></h2>

      <form id="student-form">
        <div class="group-edit-row">
          <label for="group">Groep:</label>
          <div id="group-display" class="group-display">
            <span id="group-value"></span>
            <button type="button" id="group-edit-button" class="icon-button" aria-label="Wijzig groep">✏️</button>
          </div>
          <select id="group" name="group" style="display: none;"></select>
        </div>

        <label for="sticker">Sticker:</label>
        <input type="number" id="sticker" name="sticker"><br>

        <h3>Vaardigheden</h3>
        <div id="skills-list"></div>
      </form>
    </div>
  </main>

  <!-- POPUP: STUDENT TOEVOEGEN -->
  <div id="add-student-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Nieuwe student</h3>

      <label>Voornaam:</label>
      <input id="new-student-name" type="text" placeholder="Voornaam">

      <label>Groep:</label>
      <input id="new-student-group" type="text" placeholder="Groepnaam">

      <label>Sticker:</label>
      <input id="new-student-sticker" type="number" value="0">

      <button id="save-student-button">Opslaan</button>
      <button id="cancel-student-button">Annuleren</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
